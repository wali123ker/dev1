{% for field in form %}
<div class="mb-4">
    <label for="{{ field.id_for_label }}"
           class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">
        {{ field.label }}
    </label>
    {{ field }}
    {% if field.errors %}
        {% for error in field.errors %}
        <p class="text-red-500 text-xs mt-1">⚠ {{ error }}</p>
        {% endfor %}
    {% endif %}
    {% if field.help_text %}
    <p class="text-gray-400 dark:text-gray-500 text-xs mt-1 leading-relaxed">
        💡 {{ field.help_text }}
    </p>
    {% endif %}
</div>
{% endfor %}
