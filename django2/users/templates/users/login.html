{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-gray-100">Iniciar sesión</h1>
        <p class="text-gray-400 text-sm mt-1">Introduce tus credenciales para entrar</p>
    </div>
    <form action='/users/login/' method='post'>
        {% csrf_token %}
        <style>
            input[type="text"], input[type="password"] {
                display: block; width: 100%; padding: 9px 12px;
                margin: 5px 0 14px 0; border: 1px solid #d1d5db;
                border-radius: 8px; color: #ffffff !important;
                background-color: #ffffff !important; font-size: 0.95rem;
            }
            label { color: #ffffff !important; font-weight: 600; display: block; margin-top: 8px; font-size: 0.9rem; }
            ul { color: #ef4444; font-size: 0.82rem; margin-bottom: 8px; list-style: none; padding: 0; }
            p { color: #ffffff; font-size: 0.82rem; margin-bottom: 4px; }
        </style>
        {% if request.GET.next %}
            <input type='hidden' name='next' value='{{ request.GET.next }}'>
        {% endif %}
        {{ form.as_p }}
        <button type="submit" style="background-color:#2563eb; color:#ffffff;" class="w-full mt-4 px-6 py-2.5 rounded-xl hover:opacity-80 font-bold text-sm transition">
             Entrar
        </button>
    </form>
    <p class="text-center mt-5 text-sm text-gray-500">
        ¿No tienes cuenta? <a href="{% url 'users:register' %}" class="text-blue-600 hover:underline font-medium">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
