{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow">
    <h1 class="text-4xl font-bold text-gray-900 mb-6 text-center">Iniciar Sesión</h1>
    <form action='/users/login/' method='post'>
        {% csrf_token %}
        <style>
            input[type="text"], input[type="password"] {
                display: block;
                width: 100%;
                padding: 8px 12px;
                margin: 6px 0 16px 0;
                border: 1px solid #d1d5db;
                border-radius: 6px;
                color: #111827 !important;
                background-color: #ffffff !important;
                font-size: 1rem;
            }
            label {
                color: #374151 !important;
                font-weight: 600;
                display: block;
                margin-top: 8px;
            }
            ul { color: #ef4444; font-size: 0.85rem; margin-bottom: 8px; }
            p { color: #374151; font-size: 0.85rem; margin-bottom: 4px; }
        </style>
        {% if request.GET.next %}
            <input type='hidden' name='next' value='{{ request.GET.next }}'>
        {% endif %}
        {{ form.as_p }}
        <button type="submit" style="background-color:#ffffff; color:#000000 !important;" class="w-full mt-4 px-6 py-2 rounded hover:opacity-90 font-semibold">
        Entrar
        </button>
    </form>
    <p class="text-center mt-4 text-gray-600">
        ¿No tienes cuenta? <a href="{% url 'users:register' %}" class="text-blue-600 hover:underline">Regístrate</a>
    </p>
</div>
{% endblock %}
